async function rebuildDex(){let arr=[];$('loadMsg').textContent='シリーズ一覧を準備中…';for(let g of settings.gens){try{arr.push(...await getGen(g))}catch(e){$('loadMsg').textContent=e.message+'。通信を確認して再試行してください。';throw e}}let cached={};try{cached=JSON.parse(localStorage.getItem(DATAKEY)||'{}')}catch(e){}dex=arr.map(p=>cached[p.id]||{...p,types:[],stats:null});dexMap=new Map(dex.map(p=>[p.id,p]));$('pokemonSelect').innerHTML='<option value="">一覧から選択</option>'+dex.map(p=>`<option value="${p.id}">No.${p.id} ${p.name}</option>`).join('');$('loadMsg').textContent=`${dex.length}匹の候補を準備しました。画像は表示時に読み込みます。`;renderPick()}
async function load(){initializeSettings();try{await rebuildDex()}catch(e){}showPicker()}
$('saveSettings').onclick=async()=>{let gens=[...document.querySelectorAll('.gencheck:checked')].map(e=>Number(e.value));if(!gens.length){$('settingStatus').textContent='シリーズを1つ以上選んでね';return}settings={names:[$('name0').value.trim()||'パパ',$('name1').value.trim()||'だいき'],gens,finalOnly:$('finalOnly').checked};try{localStorage.setItem(KEY,JSON.stringify(settings))}catch(e){}$('settingStatus').textContent='保存しました！';picked=[[],[]];picker=0;try{await rebuildDex();showPicker()}catch(e){$('settingStatus').textContent='シリーズ取得に失敗。ネット接続を確認して再試行してください。'}};
async function isFinal(id){let cache={};try{cache=JSON.parse(localStorage.getItem('parentbattle-final-v08')||'{}')}catch(e){}if(cache[id]!==undefined)return cache[id];let r=await fetch('https://pokeapi.co/api/v2/pokemon-species/'+id+'/');if(!r.ok)throw Error('進化情報を取得できません');let species=await r.json();let chain=await fetch(species.evolution_chain.url).then(x=>x.json());let nodes=[chain.chain],found=null;while(nodes.length){let n=nodes.shift();if(Number(n.species.url.match(/\/(\d+)\/$/)?.[1])===id)found=n;nodes.push(...n.evolves_to)}let result=!!found&&found.evolves_to.length===0;cache[id]=result;try{localStorage.setItem('parentbattle-final-v08',JSON.stringify(cache))}catch(e){}return result}
async function fetchSelected(){const ids=[...new Set(picked.flat())];let cached={};try{cached=JSON.parse(localStorage.getItem(DATAKEY)||'{}')}catch(e){}const needed=ids.filter(id=>!dexMap.get(id)?.stats);$('loadMsg').textContent=`対戦データ取得中… 0/${needed.length}`;let done=0;const results=await Promise.allSettled(needed.map(async id=>{let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+id);if(!r.ok)throw Error('HTTP '+r.status);let p=await r.json();let item={id,name:dexMap.get(id).name,types:p.types.map(t=>t.type.name),stats:p.stats.map(s=>s.base_stat)};dexMap.set(id,item);cached[id]=item;$('loadMsg').textContent=`対戦データ取得中… ${++done}/${needed.length}`}));try{localStorage.setItem(DATAKEY,JSON.stringify(cached))}catch(e){}if(results.some(x=>x.status==='rejected'))throw Error('通信に失敗しました。もう一度お試しください。');dex=dex.map(p=>dexMap.get(p.id))}
function renderPick(){let list=$('choices');list.innerHTML='';let selected=picked[picker];$('pickTitle').textContent=`${player(picker)}：3匹選ぼう！`;$('selectionInfo').textContent=`選択中 ${selected.length}/3：${selected.map(id=>dexMap.get(id)?.name).join('、')||'まだ選んでいません'}`;$('confirmPick').disabled=selected.length!==3;let q=$('searchBox').value.trim().toLowerCase();let candidates=dex.filter(p=>!q||p.name.toLowerCase().includes(q)||String(p.id)===q);if(!q&&candidates.length>180)candidates=candidates.slice(0,180);candidates.forEach(p=>{let b=document.createElement('button');b.className='poke'+(selected.includes(p.id)?' selected':'');b.innerHTML=`<img loading="lazy" src="${img(p.id)}" alt=""><strong>${p.name}</strong><small>No.${p.id} ${p.types?.map(t=>typeJP[t]||t).join(' / ')||''}</small>`;b.onclick=()=>toggle(p.id);list.append(b)});if(dex.length>180&&!q){let m=document.createElement('p');m.className='muted';m.textContent='表示を軽くするため先頭180匹を表示中。ほかのポケモンは名前・図鑑番号で検索してね。';list.append(m)}}
async function toggle(id){let a=picked[picker],i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<3){if(settings.finalOnly){$('loadMsg').textContent='進化情報を確認中…';try{if(!await isFinal(id)){$('loadMsg').textContent='このポケモンは最終進化ではありません';return}}catch(e){$('loadMsg').textContent='進化情報を取得できません。通信を確認してね';return}}a.push(id)}renderPick()}
$('searchBox').oninput=renderPick;$('pokemonSelect').onchange=e=>{let id=Number(e.target.value);if(id){toggle(id);e.target.value=''}};
$('confirmPick').onclick=async()=>{if(picker===0){picker=1;renderPick();window.scrollTo(0,0)}else{let btn=$('confirmPick');btn.disabled=true;btn.textContent='6匹を準備中…';try{await fetchSelected();start()}catch(e){$('loadMsg').textContent=e.message;btn.disabled=false}finally{btn.textContent='決定'}}};
function makePoke(id){let p=dexMap.get(id),level=50,stats=p.stats.map((s,i)=>i===0?Math.floor((2*s+31)*level/100)+level+10:Math.floor((2*s+31)*level/100)+5);let types=p.types;let ms=[...types.map(move),...fallbackMoves];while(ms.length<4)ms.push(move('normal'));return {...p,stats,maxHp:stats[0],hp:stats[0],moves:ms.slice(0,4).map(m=>({...m,pp:15}))}}
function start(){teams=picked.map(arr=>arr.map(makePoke));$('setup').classList.add('hide');$('game').classList.remove('hide');commands=[null,null];phase=0;finished=false;round=1;busy=false;active=[0,0];$('log').innerHTML='';note('バトルスタート！ 先に相手の3匹を倒したら勝ち！');promptPlayer(0)}
function current(p){return teams[p][active[p]]}function alive(p){return teams[p].some(x=>x.hp>0)}function bar(p,reverse){let x=current(p),pct=Math.max(0,x.hp/x.maxHp*100);return `<div class="fighter ${reverse?'reverse':''}"><img src="${img(x.id,reverse)}" onerror="this.src='${img(x.id)}'" alt="${x.name}"><div class="stats"><b>${x.name}</b> <span class="tag">Lv.50</span><p class="muted">${x.types.map(t=>typeJP[t]).join(' / ')}</p><div class="hp"><div style="width:${pct}%;background:${pct>50?'#39b87b':pct>20?'#eab64c':'#e26b67'}"></div></div><small>HP ${x.hp} / ${x.maxHp}</small></div></div>`}
function render(){let me=phase,opp=1-me;$('roundNumber').textContent='ROUND '+round;$('enemy').innerHTML=bar(opp,false);$('ally').innerHTML=bar(me,true);$('turnTitle').textContent=`${player(me)} の番`;let x=current(me);$('moves').innerHTML='';x.moves.forEach((m,i)=>{let b=document.createElement('button');b.className='btn secondary movebtn';b.innerHTML=`${m.name}<br><small>${typeJP[m.type]} / 威力${m.power} / PP${m.pp}</small>`;b.disabled=m.pp<=0||forced!==null;b.onclick=()=>selectCommand({kind:'move',index:i});$('moves').append(b)});$('switches').innerHTML='';teams[me].forEach((p,i)=>{let b=document.createElement('button');b.innerHTML=`<img src="${img(p.id)}"><br><small>${p.name}<br>HP ${p.hp}/${p.maxHp}</small>`;b.disabled=p.hp<=0||i===active[me];b.onclick=()=>selectCommand({kind:'switch',index:i});$('switches').append(b)});$('actionTitle').textContent=forced!==null?'倒れたポケモンの代わりを選んでね':'技を選ぶか、ポケモンを交代しよう'}
function promptPlayer(p){phase=p;render();show(`${player(p)} の番！`,'相手に画面を見せずに技を選んでね。','準備OK！',()=>{$('turnTitle').scrollIntoView({behavior:'smooth',block:'start'})})}
function show(title,desc,label,fn){$('forcedChoices').hidden=true;$('overlayButton').hidden=false;$('overlayTitle').textContent=title;$('overlayText').textContent=desc;$('overlayButton').textContent=label;$('overlay').classList.add('visible');$('overlayButton').onclick=()=>{$('overlay').classList.remove('visible');fn?.()}}
function showForcedSwitch(){let p=forced;let box=$('forcedChoices');box.innerHTML='';teams[p].forEach((mon,i)=>{if(mon.hp<=0||i===active[p])return;let b=document.createElement('button');let pic=document.createElement('img');pic.src=img(mon.id);pic.alt=mon.name;b.append(pic);let name=document.createElement('span');name.textContent=mon.name;b.append(name);let hp=document.createElement('small');hp.textContent=`HP ${mon.hp} / ${mon.maxHp}`;b.append(hp);b.onclick=()=>{$('overlay').classList.remove('visible');box.hidden=true;selectCommand({kind:'switch',index:i})};box.append(b)});$('overlayTitle').textContent=`${player(p)}！`; $('overlayText').textContent='次に出すポケモンをタップしてね！';$('overlayButton').hidden=true;box.hidden=false;$('overlay').classList.add('visible')}
function selectCommand(cmd){if(busy||finished)return;let p=phase;if(forced!==null){if(cmd.kind!=='switch')return;active[p]=cmd.index;note(`${player(p)}は${current(p).name}を出した！`);forced=null;commands=[null,null];round++;promptPlayer(0);return}commands[p]=cmd;if(p===0){promptPlayer(1)}else resolve()}
function factor(moveType,def){return def.types.reduce((v,t)=>v*(effectiveness[moveType]?.[t]??1),1)}function speed(p){return current(p).stats[5]}function note(t){let div=document.createElement('div');div.textContent=t;$('log').append(div);$('log').scrollTop=$('log').scrollHeight}
const pause=ms=>new Promise(r=>setTimeout(r,$('fastMode').checked?Math.min(120,ms):ms));
function beep(freq=450,duration=.12,wave='sine'){if(!$('soundOn').checked)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.065,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function say(t){note(t);$('battlefeed').textContent=t}
async function animateMove(p,m,damage,eff){let attacker=p===phase?'ally':'enemy',target=p===phase?'enemy':'ally';// field order depends on phase
let a=$(attacker),b=$(target);a.classList.add('attack');beep(m.type==='electric'?850:m.type==='fire'?520:m.type==='water'?380:430,.16,'triangle');await pause(360);a.classList.remove('attack');let fx=$('effect');fx.className='effect active '+(fx.classList.contains(m.type)?m.type:(['fire','water','electric','grass','psychic','ice'].includes(m.type)?m.type:'other'));b.classList.add('hit');if(damage)beep(eff>1?190:260,.2,'sawtooth');await pause(500);fx.className='effect';b.classList.remove('hit')}
async function resolve(){if(busy)return;busy=true;let order=[0,1].sort((a,b)=>{let ca=commands[a],cb=commands[b];let pa=ca.kind==='switch'?10:(current(a).moves[ca.index].priority||0),pb=cb.kind==='switch'?10:(current(b).moves[cb.index].priority||0);return pb-pa||speed(b)-speed(a)||(Math.random()<.5?-1:1)});phase=0;render();$('moves').querySelectorAll('button').forEach(b=>b.disabled=true);$('switches').querySelectorAll('button').forEach(b=>b.disabled=true);
for(let p of order){if(finished)break;let c=commands[p],x=current(p);if(x.hp<=0)continue;if(c.kind==='switch'){active[p]=c.index;say(`${player(p)}は${current(p).name}に交代！`);beep(660,.13);render();await pause(700);continue}let m=x.moves[c.index];if(!m||m.pp<=0)continue;m.pp--;let y=current(1-p);say(`${x.name}の ${m.name}！`);await pause(450);if(Math.random()*100>=m.accuracy){say(`${x.name}の攻撃は外れた！`);beep(170,.15);await pause(650);continue}let eff=factor(m.type,y),atk=x.stats[m.category==='physical'?1:3],def=Math.max(1,y.stats[m.category==='physical'?2:4]);let crit=Math.random()<1/24?1.5:1;let dmg=eff===0?0:Math.max(1,Math.floor((((22*m.power*atk/def)/50)+2)*(x.types.includes(m.type)?1.5:1)*eff*crit*(.85+Math.random()*.15)));await animateMove(p,m,dmg,eff);y.hp=Math.max(0,y.hp-dmg);render();let result=eff===0?'効果がない…':eff>1?'効果は ばつぐん！':eff<1?'効果は いまひとつ…':'';say(`${y.name}に ${dmg}ダメージ！ ${result}${crit>1?' 急所に当たった！':''}`);await pause(850);if(y.hp===0){say(`${y.name}は倒れた！`);beep(150,.35,'triangle');let faintId=(1-p===phase?'ally':'enemy');$(faintId).classList.add('faint');await pause(650);$(faintId).classList.remove('faint');if(!alive(1-p)){finished=true;busy=false;show(`🏆 ${player(p)} の勝ち！`,'3匹を倒した！ おめでとう！','もう一度',()=>location.reload());return}forced=1-p;commands=[null,null];phase=forced;busy=false;render();showForcedSwitch();return}}
commands=[null,null];round++;busy=false;promptPlayer(0)}
$('restart').onclick=()=>{if(confirm('バトルを最初からやり直しますか？'))location.reload()};load();
</script></body></html>
