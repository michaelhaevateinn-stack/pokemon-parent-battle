</style></head><body><main><h1>⚡ 親子ポケモンバトル</h1><p class="muted">初代151匹から3匹ずつ選んで、1台のスマホで交代プレイ！</p><section id="setup" class="panel"><h2 id="pickTitle">プレイヤー1：3匹選ぼう！</h2><p class="muted">好きなポケモンをタップ（3/3まで）。一覧はすぐ表示。選んだ6匹だけ通信して、次回のために保存します。</p><input class="search" id="searchBox" placeholder="🔎 名前で検索（例：ピカチュウ）" aria-label="名前で検索"><label>ポケモンを探す <select id="pokemonSelect"><option value="">一覧から選択</option></select></label><p id="selectionInfo" class="muted"></p><div class="pickgrid"><div id="choices" class="grid"></div></div><p class="center"><button class="btn" id="confirmPick" disabled>決定</button></p><p class="loading" id="loadMsg">ポケモンのデータを準備中…</p></section><section id="game" class="hide"><div class="panel"><div class="topbar"><h2 id="turnTitle"></h2><span id="roundNumber" class="round">ROUND 1</span></div><div class="arena"><div id="effect" class="effect"></div><div class="fighter" id="enemy"></div><div class="fighter reverse" id="ally"></div></div><div id="battlefeed" class="battlefeed">バトル開始！</div><div class="game-controls"><label class="toggle"><input type="checkbox" id="soundOn" checked> 🔊 効果音</label><label class="toggle"><input type="checkbox" id="fastMode"> 演出を短縮</label></div></div><div class="panel"><h2 id="actionTitle">行動を選ぼう</h2><div id="moves" class="actions"></div><h2>ポケモンを交代</h2><div id="switches" class="switches"></div></div><div class="panel"><h2>バトル記録</h2><div class="log" id="log" aria-live="polite"></div></div></section><p class="center"><button class="btn secondary" id="restart">最初からやり直す</button></p></main><div id="overlay"><div><h2 id="overlayTitle"></h2><p id="overlayText"></p><button id="overlayButton" class="btn">OK！</button></div></div><script>
const names=['フシギダネ','フシギソウ','フシギバナ','ヒトカゲ','リザード','リザードン','ゼニガメ','カメール','カメックス','キャタピー','トランセル','バタフリー','ビードル','コクーン','スピアー','ポッポ','ピジョン','ピジョット','コラッタ','ラッタ','オニスズメ','オニドリル','アーボ','アーボック','ピカチュウ','ライチュウ','サンド','サンドパン','ニドラン♀','ニドリーナ','ニドクイン','ニドラン♂','ニドリーノ','ニドキング','ピッピ','ピクシー','ロコン','キュウコン','プリン','プクリン','ズバット','ゴルバット','ナゾノクサ','クサイハナ','ラフレシア','パラス','パラセクト','コンパン','モルフォン','ディグダ','ダグトリオ','ニャース','ペルシアン','コダック','ゴルダック','マンキー','オコリザル','ガーディ','ウインディ','ニョロモ','ニョロゾ','ニョロボン','ケーシィ','ユンゲラー','フーディン','ワンリキー','ゴーリキー','カイリキー','マダツボミ','ウツドン','ウツボット','メノクラゲ','ドククラゲ','イシツブテ','ゴローン','ゴローニャ','ポニータ','ギャロップ','ヤドン','ヤドラン','コイル','レアコイル','カモネギ','ドードー','ドードリオ','パウワウ','ジュゴン','ベトベター','ベトベトン','シェルダー','パルシェン','ゴース','ゴースト','ゲンガー','イワーク','スリープ','スリーパー','クラブ','キングラー','ビリリダマ','マルマイン','タマタマ','ナッシー','カラカラ','ガラガラ','サワムラー','エビワラー','ベロリンガ','ドガース','マタドガス','サイホーン','サイドン','ラッキー','モンジャラ','ガルーラ','タッツー','シードラ','トサキント','アズマオウ','ヒトデマン','スターミー','バリヤード','ストライク','ルージュラ','エレブー','ブーバー','カイロス','ケンタロス','コイキング','ギャラドス','ラプラス','メタモン','イーブイ','シャワーズ','サンダース','ブースター','ポリゴン','オムナイト','オムスター','カブト','カブトプス','プテラ','カビゴン','フリーザー','サンダー','ファイヤー','ミニリュウ','ハクリュー','カイリュー','ミュウツー','ミュウ'];
const typeJP={normal:'ノーマル',fire:'ほのお',water:'みず',electric:'でんき',grass:'くさ',ice:'こおり',fighting:'かくとう',poison:'どく',ground:'じめん',flying:'ひこう',psychic:'エスパー',bug:'むし',rock:'いわ',ghost:'ゴースト',dragon:'ドラゴン',dark:'あく',steel:'はがね',fairy:'フェアリー'};
const effectiveness={normal:{rock:.5,ghost:0,steel:.5},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2,steel:2},flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5,steel:.5},psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},ghost:{normal:0,psychic:2,ghost:2,dark:.5},dragon:{dragon:2,steel:.5,fairy:0},dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5}};
const fallbackMoves=[{name:'たいあたり',type:'normal',power:40,accuracy:100,category:'physical'},{name:'でんこうせっか',type:'normal',power:40,accuracy:100,category:'physical',priority:1}];
const movesByType={normal:['のしかかり',85,'physical'],fire:['かえんほうしゃ',90,'special'],water:['なみのり',90,'special'],electric:['10まんボルト',90,'special'],grass:['エナジーボール',90,'special'],ice:['れいとうビーム',90,'special'],fighting:['かわらわり',75,'physical'],poison:['ヘドロばくだん',90,'special'],ground:['じしん',100,'physical'],flying:['つばめがえし',60,'physical'],psychic:['サイコキネシス',90,'special'],bug:['シザークロス',80,'physical'],rock:['いわなだれ',75,'physical'],ghost:['シャドーボール',80,'special'],dragon:['りゅうのはどう',85,'special'],dark:['かみくだく',80,'physical'],steel:['アイアンヘッド',80,'physical'],fairy:['マジカルシャイン',80,'special']};
const move=(type)=>{let m=movesByType[type]||movesByType.normal;return {name:m[0],type,power:m[1],accuracy:100,category:m[2]}};
const $=id=>document.getElementById(id);let dex=[],picked=[[],[]],picker=0,teams=[],active=[0,0],commands=[null,null],phase=0,forced=null,finished=false,round=1,busy=false,audioCtx=null;
const img=(id,back=false)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${back?'back/':''}${id}.png`;
async function load(){
 let cached={};try{cached=JSON.parse(localStorage.getItem('parentbattle-selected-v03'))||{}}catch{}
 dex=names.map((name,i)=>cached[i+1]||{id:i+1,name,types:[],stats:null});
 ready();
 $('loadMsg').textContent='151匹の一覧は準備完了！ バトルに使う6匹だけ通信します。';
}
async function fetchSelected(){
 const ids=[...new Set(picked.flat())];let cached={};try{cached=JSON.parse(localStorage.getItem('parentbattle-selected-v03'))||{}}catch{}
 const needed=ids.filter(id=>!dex[id-1].stats);
 $('loadMsg').textContent=`選んだポケモンのデータ取得中… 0/${needed.length}`;
 let done=0;
 const results=await Promise.allSettled(needed.map(async id=>{
  const response=await fetch('https://pokeapi.co/api/v2/pokemon/'+id);
  if(!response.ok)throw Error('HTTP '+response.status);
  const p=await response.json();
  const item={id,name:names[id-1],types:p.types.map(t=>t.type.name),stats:p.stats.map(s=>s.base_stat)};
  dex[id-1]=item;cached[id]=item;
  $('loadMsg').textContent=`選んだポケモンのデータ取得中… ${++done}/${needed.length}`;
 }));
 try{localStorage.setItem('parentbattle-selected-v03',JSON.stringify(cached))}catch{}
 if(results.some(x=>x.status==='rejected'))throw Error('通信に失敗しました。ネット接続を確認してもう一度お試しください。');
}
function ready(){let sel=$('pokemonSelect');dex.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=`No.${p.id} ${p.name}`;sel.append(o)});$('loadMsg').textContent='準備完了！';renderPick()}
function renderPick(){let list=$('choices');list.innerHTML='';let selected=picked[picker];$('pickTitle').textContent=`プレイヤー${picker+1}：3匹選ぼう！`;$('selectionInfo').textContent=`選択中 ${selected.length}/3：${selected.map(id=>names[id-1]).join('、')||'まだ選んでいません'}`;$('confirmPick').disabled=selected.length!==3;dex.filter(p=>!$('searchBox').value||p.name.includes($('searchBox').value.trim())||String(p.id)===$('searchBox').value.trim()).forEach(p=>{let b=document.createElement('button');b.className='poke'+(selected.includes(p.id)?' selected':'');b.innerHTML=`<img loading="lazy" src="${img(p.id)}" alt=""><strong>${p.name}</strong><small>${(p.types.length?p.types.map(t=>typeJP[t]||t).join(' / '):'')}</small>`;b.onclick=()=>toggle(p.id);list.append(b)})}
function toggle(id){let a=picked[picker],i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(id);renderPick()}
$('searchBox').oninput=renderPick;
$('pokemonSelect').onchange=e=>{let id=Number(e.target.value);if(id){toggle(id);let el=[...$('choices').children].find(x=>x.textContent.includes(names[id-1]));el?.scrollIntoView({behavior:'smooth',block:'center'});e.target.value=''}};
$('confirmPick').onclick=async()=>{if(picker===0){picker=1;renderPick();window.scrollTo(0,0)}else {const btn=$('confirmPick');btn.disabled=true;btn.textContent='6匹を準備中…';try{await fetchSelected();start()}catch(e){$('loadMsg').textContent=e.message;btn.disabled=false;btn.textContent='再試行'}}};
function makePoke(id){let p=dex[id-1],level=50,stats=p.stats.map((s,i)=>i===0?Math.floor((2*s+31)*level/100)+level+10:Math.floor((2*s+31)*level/100)+5);let types=p.types;let ms=[...types.map(move),...fallbackMoves];while(ms.length<4)ms.push(move('normal'));return {...p,stats,maxHp:stats[0],hp:stats[0],moves:ms.slice(0,4).map(m=>({...m,pp:15}))}}
function start(){teams=picked.map(arr=>arr.map(makePoke));$('setup').classList.add('hide');$('game').classList.remove('hide');commands=[null,null];phase=0;finished=false;round=1;busy=false;active=[0,0];$('log').innerHTML='';note('バトルスタート！ 先に相手の3匹を倒したら勝ち！');promptPlayer(0)}
function current(p){return teams[p][active[p]]}function alive(p){return teams[p].some(x=>x.hp>0)}function bar(p,reverse){let x=current(p),pct=Math.max(0,x.hp/x.maxHp*100);return `<div class="fighter ${reverse?'reverse':''}"><img src="${img(x.id,reverse)}" onerror="this.src='${img(x.id)}'" alt="${x.name}"><div class="stats"><b>${x.name}</b> <span class="tag">Lv.50</span><p class="muted">${x.types.map(t=>typeJP[t]).join(' / ')}</p><div class="hp"><div style="width:${pct}%;background:${pct>50?'#39b87b':pct>20?'#eab64c':'#e26b67'}"></div></div><small>HP ${x.hp} / ${x.maxHp}</small></div></div>`}
function render(){let me=phase,opp=1-me;$('roundNumber').textContent='ROUND '+round;$('enemy').innerHTML=bar(opp,false);$('ally').innerHTML=bar(me,true);$('turnTitle').textContent=`プレイヤー${me+1} の番`;let x=current(me);$('moves').innerHTML='';x.moves.forEach((m,i)=>{let b=document.createElement('button');b.className='btn secondary movebtn';b.innerHTML=`${m.name}<br><small>${typeJP[m.type]} / 威力${m.power} / PP${m.pp}</small>`;b.disabled=m.pp<=0||forced!==null;b.onclick=()=>selectCommand({kind:'move',index:i});$('moves').append(b)});$('switches').innerHTML='';teams[me].forEach((p,i)=>{let b=document.createElement('button');b.innerHTML=`<img src="${img(p.id)}"><br><small>${p.name}<br>HP ${p.hp}/${p.maxHp}</small>`;b.disabled=p.hp<=0||i===active[me];b.onclick=()=>selectCommand({kind:'switch',index:i});$('switches').append(b)});$('actionTitle').textContent=forced!==null?'倒れたポケモンの代わりを選んでね':'技を選ぶか、ポケモンを交代しよう'}
function promptPlayer(p){phase=p;render();show(`プレイヤー${p+1} の番！`,'相手に画面を見せずに技を選んでね。','準備OK！',()=>{$('turnTitle').scrollIntoView({behavior:'smooth',block:'start'})})}
function show(title,desc,label,fn){$('overlayTitle').textContent=title;$('overlayText').textContent=desc;$('overlayButton').textContent=label;$('overlay').classList.add('visible');$('overlayButton').onclick=()=>{$('overlay').classList.remove('visible');fn?.()}}
function selectCommand(cmd){if(busy||finished)return;let p=phase;if(forced!==null){if(cmd.kind!=='switch')return;active[p]=cmd.index;note(`プレイヤー${p+1}は${current(p).name}を出した！`);forced=null;commands=[null,null];round++;promptPlayer(0);return}commands[p]=cmd;if(p===0){promptPlayer(1)}else resolve()}
function factor(moveType,def){return def.types.reduce((v,t)=>v*(effectiveness[moveType]?.[t]??1),1)}function speed(p){return current(p).stats[5]}function note(t){let div=document.createElement('div');div.textContent=t;$('log').append(div);$('log').scrollTop=$('log').scrollHeight}
const pause=ms=>new Promise(r=>setTimeout(r,$('fastMode').checked?Math.min(120,ms):ms));
function beep(freq=450,duration=.12,wave='sine'){if(!$('soundOn').checked)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(.065,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function say(t){note(t);$('battlefeed').textContent=t}
async function animateMove(p,m,damage,eff){let attacker=p===phase?'ally':'enemy',target=p===phase?'enemy':'ally';// field order depends on phase
let a=$(attacker),b=$(target);a.classList.add('attack');beep(m.type==='electric'?850:m.type==='fire'?520:m.type==='water'?380:430,.16,'triangle');await pause(360);a.classList.remove('attack');let fx=$('effect');fx.className='effect active '+(fx.classList.contains(m.type)?m.type:(['fire','water','electric','grass','psychic','ice'].includes(m.type)?m.type:'other'));b.classList.add('hit');if(damage)beep(eff>1?190:260,.2,'sawtooth');await pause(500);fx.className='effect';b.classList.remove('hit')}
async function resolve(){if(busy)return;busy=true;let order=[0,1].sort((a,b)=>{let ca=commands[a],cb=commands[b];let pa=ca.kind==='switch'?10:(current(a).moves[ca.index].priority||0),pb=cb.kind==='switch'?10:(current(b).moves[cb.index].priority||0);return pb-pa||speed(b)-speed(a)||(Math.random()<.5?-1:1)});phase=0;render();$('moves').querySelectorAll('button').forEach(b=>b.disabled=true);$('switches').querySelectorAll('button').forEach(b=>b.disabled=true);
for(let p of order){if(finished)break;let c=commands[p],x=current(p);if(x.hp<=0)continue;if(c.kind==='switch'){active[p]=c.index;say(`プレイヤー${p+1}は${current(p).name}に交代！`);beep(660,.13);render();await pause(700);continue}let m=x.moves[c.index];if(!m||m.pp<=0)continue;m.pp--;let y=current(1-p);say(`${x.name}の ${m.name}！`);await pause(450);if(Math.random()*100>=m.accuracy){say(`${x.name}の攻撃は外れた！`);beep(170,.15);await pause(650);continue}let eff=factor(m.type,y),atk=x.stats[m.category==='physical'?1:3],def=Math.max(1,y.stats[m.category==='physical'?2:4]);let crit=Math.random()<1/24?1.5:1;let dmg=eff===0?0:Math.max(1,Math.floor((((22*m.power*atk/def)/50)+2)*(x.types.includes(m.type)?1.5:1)*eff*crit*(.85+Math.random()*.15)));await animateMove(p,m,dmg,eff);y.hp=Math.max(0,y.hp-dmg);render();let result=eff===0?'効果がない…':eff>1?'効果は ばつぐん！':eff<1?'効果は いまひとつ…':'';say(`${y.name}に ${dmg}ダメージ！ ${result}${crit>1?' 急所に当たった！':''}`);await pause(850);if(y.hp===0){say(`${y.name}は倒れた！`);beep(150,.35,'triangle');let faintId=(1-p===phase?'ally':'enemy');$(faintId).classList.add('faint');await pause(650);$(faintId).classList.remove('faint');if(!alive(1-p)){finished=true;busy=false;show(`🏆 プレイヤー${p+1} の勝ち！`,'3匹を倒した！ おめでとう！','もう一度',()=>location.reload());return}forced=1-p;commands=[null,null];phase=forced;busy=false;render();show(`プレイヤー${forced+1}！`,'次のポケモンを選んでね。','選ぶ',()=>{});return}}
commands=[null,null];round++;busy=false;promptPlayer(0)}
$('restart').onclick=()=>{if(confirm('バトルを最初からやり直しますか？'))location.reload()};load();
</script></body></html>
